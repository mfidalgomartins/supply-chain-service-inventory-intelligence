name: Scheduled Governed Analytics

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-governed-analytics
  cancel-in-progress: false

jobs:
  governed-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OBJECT_STORE_BACKEND: ${{ vars.OBJECT_STORE_BACKEND || 'local' }}
      OBJECT_STORE_ROOT: data/object_store
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PREFIX: ${{ vars.S3_PREFIX || 'supply-chain-intelligence' }}
      S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Production Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute Governed Pipeline
        run: python -m src

      - name: Upload Run Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-run-${{ github.run_id }}
          path: |
            outputs/pipeline_timings.json
            outputs/pipeline_run_events.jsonl
            outputs/pipeline_run_summary.json
            outputs/tables/data_catalog.csv
            outputs/tables/data_lineage.csv
            outputs/tables/object_publication_manifest.csv
            data/object_store/pointers/latest.json
          if-no-files-found: warn
          retention-days: 30
