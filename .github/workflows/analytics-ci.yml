name: Analytics CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format Check (ruff)
        run: ruff format --check src tests

      - name: Type Check (mypy)
        run: mypy

      - name: Dependency Audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Run End-to-End Analytics Pipeline
        run: python src/run_pipeline.py

      - name: Run Unit Tests With Coverage Floor
        run: python -m pytest

      - name: Verify Published Dashboard Is Current
        run: git diff --exit-code -- index.html

      - name: Upload Pipeline Timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-timings-py${{ matrix.python-version }}
          path: outputs/pipeline_timings.json
          if-no-files-found: ignore
